  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rder-bottom:1px solid rgba(255,255,255,0.08)\" style-hover=\"color:#fff\">Digital Logbook<\u002Fa>\n        <a href=\"#contact\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color:rgba(255,255,255,0.88);font-size:16px;font-weight:500;padding:13px 4px\" style-hover=\"color:#fff\">Contact<\u002Fa>\n        <div style=\"margin-top:12px\">\n          <x-import component-from-global-scope=\"NjiniusDesignSystem_d05417.Button\" variant=\"primary\" size=\"md\" full-width=\"{{ true }}\" sc-camel-on-click=\"{{ goContactFromMenu }}\" hint-size=\"100%,42px\">Get in touch<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <main>\n\n  <section id=\"top\" data-screen-label=\"Hero\" data-theme=\"inverse\" style=\"position:relative;overflow:hidden;background:var(--neutral-900);display:flex;align-items:flex-end;min-height:660px\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(148deg,#22343A 0%,#141F22 55%,#0D1517 100%)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0\">\n      \n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(96deg, rgba(13,21,23,var(--hero-scrim,0.93)) 0%, rgba(13,21,23,0.84) 40%, rgba(13,21,23,0.34) 100%)\"><\u002Fdiv>\n    <div style=\"position:absolute;top:-190px;right:-150px;width:580px;height:580px;border-radius:50%;pointer-events:none;background:radial-gradient(circle, rgba(112,158,168,0.38), rgba(112,158,168,0) 68%)\"><\u002Fdiv>\n\n    <div data-sec=\"\" style=\"position:relative;width:100%;max-width:var(--container-xl);margin:0 auto;padding:168px 40px 88px\">\n      <div style=\"max-width:790px\">\n        <span style=\"font-family:var(--font-eyebrow);font-size:12px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--coral-300)\">Digitising tomorrow, today<\u002Fspan>\n        <h1 style=\"color:#fff;font-family:var(--font-display);font-size:clamp(34px,5.6vw,62px);line-height:1.03;letter-spacing:-0.03em;font-weight:600;margin:18px 0 0;text-wrap:balance\">We build the products the market is missing.<\u002Fh1>\n        <p style=\"color:var(--neutral-200);font-size:clamp(16px,1.6vw,19px);line-height:1.58;margin:22px 0 0;max-width:620px;text-wrap:pretty\">NJinius is a UK product developer. We identify gaps in the market and build secure, sustainable digital products to close them — beginning with the Digital Logbook, launching July 2026.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:34px\">\n          <x-import component-from-global-scope=\"NjiniusDesignSystem_d05417.Button\" variant=\"primary\" size=\"lg\" sc-camel-on-click=\"{{ goLogbook }}\" hint-size=\"158px,52px\">The Digital Logbook\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:inline-block;vertical-align:middle;margin-left:8px\"><path d=\"M5 12h13M12 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"NjiniusDesignSystem_d05417.Button\" variant=\"outline\" size=\"lg\" sc-camel-on-click=\"{{ goContact }}\" hint-size=\"196px,52px\">Get in touch<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" data-screen-label=\"About\" data-sec=\"\" style=\"background:var(--surface-page);padding:var(--space-12) 40px;scroll-margin-top:74px\">\n    <div style=\"max-width:var(--container-xl);margin:0 auto\">\n      <div data-split=\"\" style=\"display:grid;grid-template-columns:0.92fr 1.08fr;gap:var(--space-10);align-items:start\">\n        <div>\n          <span style=\"font-family:var(--font-eyebrow);font-size:12px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-brand)\">Who we are<\u002Fspan>\n          <h2 style=\"font-family:var(--font-display);font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-0.03em;margin:12px 0 0;color:var(--text-strong)\">A product developer with its own ideas<\u002Fh2>\n          <p style=\"color:var(--text-muted);font-size:var(--text-md);line-height:1.65;margin:18px 0 0;max-width:460px;text-wrap:pretty\">NJinius identifies gaps in the market and develops the digital products that fill them. Where others see an established process, we see the opportunity to make it simpler, faster and more sustainable.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"display:grid;gap:6px;padding:22px 0;border-top:1px solid var(--border-subtle)\">\n            <h3 style=\"font-family:var(--font-display);font-size:var(--text-xl);margin:0;color:var(--text-strong)\">Market-led<\u002Fh3>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.62;max-width:520px\">Every product starts with a proven gap — a real problem, evidenced by the professionals who face it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:6px;padding:22px 0;border-top:1px solid var(--border-subtle)\">\n            <h3 style=\"font-family:var(--font-display);font-size:var(--text-xl);margin:0;color:var(--text-strong)\">Sustainable<\u002Fh3>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.62;max-width:520px\">Our products replace heavier processes — less paper, less duplication, less waste.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:6px;padding:22px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)\">\n            <h3 style=\"font-family:var(--font-display);font-size:var(--text-xl);margin:0;color:var(--text-strong)\">Long-term<\u002Fh3>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.62;max-width:520px\">We own and maintain everything we build. Our products improve continuously — they are never handed off.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"services\" data-screen-label=\"Services\" data-sec=\"\" style=\"background:var(--surface-card);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);padding:var(--space-12) 40px;scroll-margin-top:74px\">\n    <div style=\"max-width:var(--container-xl);margin:0 auto\">\n      <div style=\"max-width:640px\">\n        <span style=\"font-family:var(--font-eyebrow);font-size:12px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-brand)\">How we work<\u002Fspan>\n        <h2 style=\"font-family:var(--font-display);font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-0.03em;margin:12px 0 0;color:var(--text-strong)\">From market gap to finished product<\u002Fh2>\n        <p style=\"color:var(--text-muted);font-size:var(--text-md);line-height:1.6;margin:14px 0 0\">Four stages behind every NJinius product.<\u002Fp>\n      <\u002Fdiv>\n      <div data-svc=\"\" style=\"display:grid;grid-template-columns:repeat(var(--svc-cols,2),minmax(0,1fr));gap:var(--space-5);margin-top:var(--space-8)\">\n        <x-import component-from-global-scope=\"NjiniusDesignSystem_d05417.Card\" padding=\"lg\" elevation=\"sm\" interactive=\"{{ true }}\" hint-size=\"100%,220px\">\n          <div style=\"width:52px;height:52px;border-radius:var(--radius-md);background:var(--brand-soft);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4);color:var(--coral-700)\">\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"><\u002Fcircle><path d=\"M15.4 15.4 21 21\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-family:var(--font-display);f d=\"\" style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:var(--space-8);padding-bottom:var(--space-8);border-bottom:1px solid rgba(255,255,255,0.10)\">\n        <div>\n          <x-import component-from-global-scope=\"NjiniusDesignSystem_d05417.Logo\" tone=\"white\" height=\"28px\" hint-size=\"120px,28px\"><\u002Fx-import>\n          <p style=\"color:var(--neutral-400);font-size:var(--text-sm);line-height:1.65;margin:16px 0 0;max-width:290px\"><span style=\"color:var(--neutral-200);font-weight:600\">Digitising tomorrow, today.<\u002Fspan> NJinius is a UK product developer — identifying gaps in the market and building the digital products that close them.<\u002Fp>\n          <div style=\"display:flex;gap:8px;margin-top:20px\">\n            <a href=\"https://www.linkedin.com/company/njinius/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"NJinius on LinkedIn\" style=\"width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.22);color:var(--neutral-300);transition:background 160ms cubic-bezier(0.2,0,0,1),color 160ms cubic-bezier(0.2,0,0,1)\" style-hover=\"background:rgba(255,255,255,0.10);color:#fff\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3.2\"><\u002Frect><path d=\"M7.6 10.5V17M7.6 7.5v.1M11.6 17v-3.7a2.2 2.2 0 0 1 4.4 0V17\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n            <a href=\"https://www.youtube.com/@njinius\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"NJinius on YouTube\" style=\"width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.22);color:var(--neutral-300);transition:background 160ms cubic-bezier(0.2,0,0,1),color 160ms cubic-bezier(0.2,0,0,1)\" style-hover=\"background:rgba(255,255,255,0.10);color:#fff\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"5.5\" width=\"19\" height=\"13\" rx=\"4\"><\u002Frect><path d=\"m10.5 9.5 5 2.5-5 2.5z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n            <a href=\"mailto:support@njinius.com\" aria-label=\"Email NJinius at support@njinius.com\" style=\"width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.22);color:var(--neutral-300);transition:background 160ms cubic-bezier(0.2,0,0,1),color 160ms cubic-bezier(0.2,0,0,1)\" style-hover=\"background:rgba(255,255,255,0.10);color:#fff\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.4\"><\u002Frect><path d=\"m3.6 6.6 8.4 6 8.4-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <p style=\"color:#fff;font-size:var(--text-xs);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 4px\">Company<\u002Fp>\n          <a href=\"#about\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">About<\u002Fa>\n          <a href=\"#services\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">How we work<\u002Fa>\n          <a href=\"#contact\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Contact us<\u002Fa>\n          <a href=\"mailto:support@njinius.com\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">support@njinius.com<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <p style=\"color:#fff;font-size:var(--text-xs);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 4px\">Product<\u002Fp>\n          <a href=\"#logbook\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Digital Logbook<\u002Fa>\n          <a href=\"#logbook\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">IRSE template<\u002Fa>\n          <a href=\"https://apps.apple.com/gb/app/njinius-digital-logbook/id6753288263\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">App Store<\u002Fa>\n          <a href=\"https://play.google.com/store/apps/details?id=com.njinius.locust\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Google Play<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <p style=\"color:#fff;font-size:var(--text-xs);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 4px\">How we work<\u002Fp>\n          <a href=\"#services\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Identify<\u002Fa>\n          <a href=\"#services\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Validate<\u002Fa>\n          <a href=\"#services\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Build<\u002Fa>\n          <a href=\"#services\" style=\"color:var(--neutral-300);font-size:var(--text-sm)\" style-hover=\"color:#fff\">Improve<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:var(--neutral-500);font-size:var(--text-xs);line-height:1.65;margin:var(--space-6) 0 0\">© Copyright 2025 NJINIUS LTD · Registered in England and Wales, company number 15598424 · Registered office: 210 Tonge Moor Road, BL2 2HN.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;brandColor&quot;: {\n    &quot;editor&quot;: &quot;color&quot;,\n    &quot;default&quot;: &quot;#385860&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;options&quot;: [&quot;#385860&quot;, &quot;#2E484F&quot;, &quot;#4A6E78&quot;, &quot;#1E3A44&quot;],\n    &quot;section&quot;: &quot;Brand&quot;,\n    &quot;label&quot;: &quot;Brand colour&quot;\n  },\n  &quot;heroScrim&quot;: {\n    &quot;editor&quot;: &quot;range&quot;,\n    &quot;default&quot;: 0.93,\n    &quot;min&quot;: 0.4,\n    &quot;max&quot;: 1,\n    &quot;step&quot;: 0.02,\n    &quot;tsType&quot;: &quot;number&quot;,\n    &quot;section&quot;: &quot;Hero&quot;,\n    &quot;label&quot;: &quot;Hero overlay darkness&quot;\n  },\n  &quot;servicesColumns&quot;: {\n    &quot;editor&quot;: &quot;int&quot;,\n    &quot;default&quot;: 2,\n    &quot;min&quot;: 1,\n    &quot;max&quot;: 4,\n    &quot;tsType&quot;: &quot;number&quot;,\n    &quot;section&quot;: &quot;Layout&quot;,\n    &quot;label&quot;: &quot;Service card columns&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  state = { menuOpen: false, productsOpen: false, sent: false, slide: 0, active: '' };\n  shotCount = 5;\n\n  componentDidMount() {\n    this.applyTheme();\n    this.startShow();\n    this._onScroll = () => {\n      const ids = ['about', 'services', 'logbook', 'contact'];\n      let active = '';\n      for (const id of ids) {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top <= 140) active = id;\n      }\n      if (active !== this.state.active) this.setState({ active });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n  componentWillUnmount() {\n    clearInterval(this._timer);\n    window.removeEventListener('scroll', this._onScroll);\n  }\n\n  navColor(id) { return this.state.active === id ? '#fff' : 'rgba(255,255,255,0.86)'; }\n  navLine(id) { return this.state.active === id ? 'var(--coral-300)' : 'transparent'; }\n\n  startShow() {\n    clearInterval(this._timer);\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    this._timer = setInterval(() => this.step(1), 5200);\n  }\n  step(d) {\n    this.setState((st) => ({ slide: (st.slide + d + this.shotCount) % this.shotCount }));\n  }\n  componentDidUpdate() { this.applyTheme(); }\n\n  applyTheme() {\n    const root = document.documentElement;\n    const c = this.props.brandColor;\n    // theme-slate.css already carries a hand-tuned ramp for the default brand\n    // colour; only compute a ramp when the user picks something else.\n    if (typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c) && c.toLowerCase() !== '#385860') {\n      const base = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));\n      // Build the ramp in HSL so light steps keep the brand's chroma instead of\n      // washing out to grey (a straight mix toward white desaturates).\n      const toHsl = (rgb) => {\n        const [r, g, b] = rgb.map((v) => v / 255);\n        const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;\n        const l = (max + min) / 2;\n        let h = 0, s = 0;\n        if (d) {\n          s = d / (1 - Math.abs(2 * l - 1));\n          if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));\n          else if (max === g) h = (b - r) / d + 2;\n          else h = (r - g) / d + 4;\n          h *= 60;\n        }\n        return [h, s, l];\n      };\n      const [H, S] = toHsl(base);\n      const hex = (h, s, l) => {\n        s = Math.max(0, Math.min(1, s));\n        l = Math.max(0, Math.min(1, l));\n        const k = (n) => (n + h / 30) % 12;\n        const a = s * Math.min(l, 1 - l);\n        const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));\n        return '#' + [f(0), f(8), f(4)].map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join('');\n      };\n      // step: [lightness, saturation multiplier]\n      const step = (l, sm) => hex(H, S * sm, l);\n      const ramp = {\n        '--coral-500': c,\n        '--coral-600': step(0.25, 1.05),\n        '--coral-700': step(0.19, 1.1),\n        '--coral-800': step(0.14, 1.1),\n        '--coral-400': step(0.46, 0.95),\n        '--coral-300': step(0.61, 0.9),\n        '--coral-200': step(0.76, 0.85),\n        '--coral-100': step(0.88, 0.8),\n        '--coral-50': step(0.95, 0.7),\n        '--tint-coral': step(0.76, 0.85),\n        '--tint-apricot': step(0.82, 0.8),\n        '--tint-blush': step(0.88, 0.8),\n        '--tint-cream': step(0.91, 0.75),\n        '--tint-whisper': step(0.95, 0.6),\n        '--ring': 'rgba(' + base.join(',') + ',0.34)',\n        '--shadow-brand': '0 8px 24px rgba(' + base.join(',') + ',0.32)',\n        '--shadow-brand-sm': '0 2px 8px rgba(' + base.join(',') + ',0.26)',\n      };\n      for (const k in ramp) root.style.setProperty(k, ramp[k]);\n    }\n    const scrim = this.props.heroScrim;\n    if (typeof scrim === 'number') root.style.setProperty('--hero-scrim', String(scrim));\n    const cols = this.props.servicesColumns;\n    if (cols) root.style.setProperty('--svc-cols', String(cols));\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.pageYOffset - 68;\n    window.scrollTo({ top, behavior: 'smooth' });\n  }\n\n  renderVals() {\n    return {\n      menuOpen: this.state.menuOpen,\n      menuClosed: !this.state.menuOpen,\n      productsOpen: this.state.productsOpen,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      openProducts: () => this.setState({ productsOpen: true }),\n      closeProducts: () => this.setState({ productsOpen: false }),\n      navAboutColor: this.navColor('about'),\n      navAboutLine: this.navLine('about'),\n      navWorkColor: this.navColor('services'),\n      navWorkLine: this.navLine('services'),\n      navProductsColor: this.navColor('logbook'),\n      navProductsLine: this.navLine('logbook'),\n      navContactColor: this.navColor('contact'),\n      navContactLine: this.navLine('contact'),\n      trackShift: 'translateX(-' + this.state.slide * 20 + '%)',\n      dots: ['Homepage dashboard', 'Work Experience', 'Training', 'Secure login', 'Records and verification'].map((label, i) => ({\n        label: 'Show ' + label,\n        bg: i === this.state.slide ? '#fff' : 'rgba(255,255,255,0.28)',\n        go: () => { this.setState({ slide: i }); this.startShow(); },\n      })),\n      prevSlide: () => { this.step(-1); this.startShow(); },\n      nextSlide: () => { this.step(1); this.startShow(); },\n      pauseShow: () => clearInterval(this._timer),\n      resumeShow: () => this.startShow(),\n      goServices: () => this.scrollTo('services'),\n      goLogbook: () => this.scrollTo('logbook'),\n      goContact: () => this.scrollTo('contact'),\n      goContactFromMenu: () => { this.setState({ menuOpen: false }); setTimeout(() => this.scrollTo('contact'), 60); },\n      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
