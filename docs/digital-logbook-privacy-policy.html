       <li>The legitimate interests of Njinius Ltd and our users<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We aim to retain information no longer than is reasonably necessary while ensuring that the Service remains secure, reliable and compliant with applicable legal obligations.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"s12\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">12<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Your rights<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Applicable data protection legislation gives individuals a number of rights in relation to their personal information. Njinius Ltd is committed to respecting those rights and responding to requests in accordance with applicable law.<\u002Fp>\n          <p style=\"margin:0 0 22px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Depending on your circumstances, your rights may include:<\u002Fp>\n\n          <div style=\"display:grid;gap:0\">\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right of access<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">You may request confirmation of whether we process your personal information and, where applicable, request access to that information.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to rectification<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">You may request that inaccurate or incomplete personal information is corrected. Where possible, we encourage users to keep their account information up to date directly within the Service.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to erasure<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">In certain circumstances, you may request that your personal information is deleted. This right is not absolute and may be subject to legal or regulatory obligations requiring us to retain certain information.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to restrict processing<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">You may request that we temporarily restrict the processing of your personal information in certain circumstances.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to object<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Where processing is based on legitimate interests, you may object to that processing where applicable. We will consider each request in accordance with applicable law.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to data portability<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Where applicable, you may request a copy of certain personal information in a structured, commonly used and machine-readable format.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to withdraw consent<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Where processing is based on your consent, you may withdraw that consent at any time. Withdrawal will not affect processing carried out before consent was withdrawn.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Right to lodge a complaint<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">If you believe your personal information has been handled unlawfully, you have the right to lodge a complaint with the appropriate supervisory authority. We encourage users to contact Njinius first so that we have an opportunity to understand and resolve any concerns wherever possible.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Exercising your rights<\u002Fp>\n            <p style=\"margin:0 0 9px;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">If you wish to exercise any of your rights, please contact us at <a href=\"mailto:privacy@njinius.com\" style=\"color:var(--text-brand);font-weight:600\">privacy@njinius.com<\u002Fa>.<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">To protect the privacy and security of our users, we may request reasonable information to verify your identity before responding to certain requests. We will respond to requests within the timeframes required by applicable data protection legislation.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s13\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">13<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Account deletion<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Users may request deletion of their Njinius account in accordance with the functionality provided by the Service or by contacting us.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where an account is deleted, associated personal information will normally be deleted or anonymised within a reasonable period, unless continued retention is required or permitted by law.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Before deleting your account<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Before requesting account deletion, users should consider whether they wish to retain copies of any Professional Records stored within the Service. Professional Records may represent significant professional experience accumulated over time.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Once deleted, these records may not be recoverable. Where the Service provides export functionality, users are encouraged to retain copies of their Professional Records before requesting deletion.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Information that may be retained<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Even after account deletion, certain limited information may be retained where necessary to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Comply with legal obligations<\u002Fli>\n            <li>Resolve disputes<\u002Fli>\n            <li>Protect the security of the Service<\u002Fli>\n            <li>Prevent fraud or misuse<\u002Fli>\n            <li>Enforce our Terms of Use<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Any retained information will be limited to what is reasonably necessary for those purposes.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Respecting your decision<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">If you choose to leave the Service, we will process your account deletion request responsibly and in accordance with applicable legal requirements. Our aim is to ensure that the process is transparent, secure and respectful of both your rights and our legal obligations.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s14\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">14<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Children's privacy<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">The Njinius Service is intended for use by individuals managing their professional development, competency and professional records. The Service is not designed for or directed at children.<\u002Fp>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We do not knowingly collect personal information from children. If we become aware that personal information has been collected from a child in circumstances where such processing is not permitted by applicable law, we will take reasonable steps to delete that information as soon as practicable.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">If you believe that a child has provided personal information through the Service, please contact us using the details provided at the end of this Privacy Notice.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Why this matters<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Protecting children's privacy is an important part of responsible data management. Although the Service is intended for professional users, we recognise our responsibility to respond appropriately should we become aware that children's personal information has been provided to the Service in error.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s15\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">15<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Changes to this Privacy Notice<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">As the Njinius Service evolves, it may become necessary to update this Privacy Notice from time to time. Changes may be made to reflect:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Improvements to the Service<\u002Fli>\n            <li>New functionality<\u002Fli>\n            <li>Changes in applicable laws or regulations<\u002Fli>\n            <li>Updates to our operational practices<\u002Fli>\n            <li>Improvements to the clarity or accuracy of this document<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where changes are material, we will take reasonable steps to make users aware before or when those changes take effect.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">The most recent version of this Privacy Notice will always be made available through the Service or our website. The version number and effective date shown at the top of this document indicate the current published version.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Our commitment<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">While this Privacy Notice may change over time, our commitment to handling personal information responsibly, transparently and securely remains unchanged. Whenever we update this document, we aim to preserve the principles of openness, fairness and respect that underpin the Njinius Service.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s16\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0 0\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">16<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Contact information<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">If you have any questions about this Privacy Notice, your personal information or how Njinius Ltd processes personal information, please contact us. We will make reasonable efforts to respond to enquiries promptly and in accordance with applicable legal requirements.<\u002Fp>\n\n          <div data-contact-split=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin:22px 0 0\">\n            <div style=\"padding:20px 22px;background:var(--neutral-50);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)\">\n              <p style=\"margin:0 0 10px;font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-muted)\">Registered office<\u002Fp>\n              <p style=\"margin:0;color:var(--text-strong);font-size:var(--text-sm);line-height:1.75;font-weight:500\">Njinius Ltd<br>210 Tonge Moor Road<br>Bolton<br>England<br>BL2 2HN<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;background:var(--neutral-50);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)\">\n              <p style=\"margin:0 0 10px;font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-muted)\">Email<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <a href=\"mailto:support@njinius.com\" style=\"display:flex;gap:9px;align-items:center;color:var(--text-strong);font-size:var(--text-sm);font-weight:600\" style-hover=\"color:var(--text-brand)\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"var(--text-brand)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.4\"><\u002Frect><path d=\"m3.6 6.6 8.4 6 8.4-6\"><\u002Fpath><\u002Fsvg>support@njinius.com\n                <\u002Fa>\n                <a href=\"mailto:privacy@njinius.com\" style=\"display:flex;gap:9px;align-items:center;color:var(--text-strong);font-size:var(--text-sm);font-weight:600\" style-hover=\"color:var(--text-brand)\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"var(--text-brand)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"9.5\" rx=\"2\"><\u002Frect><path d=\"M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5\"><\u002Fpath><\u002Fsvg>privacy@njinius.com\n                <\u002Fa>\n                <a href=\"mailto:security@njinius.com\" style=\"display:flex;gap:9px;align-items:center;color:var(--text-strong);font-size:var(--text-sm);font-weight:600\" style-hover=\"color:var(--text-brand)\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"var(--text-brand)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M12 3l7 3v5.5c0 4.5-3 7.7-7 9.5-4-1.8-7-5-7-9.5V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>security@njinius.com\n                <\u002Fa>\n                <p style=\"margin:2px 0 0;color:var(--text-muted);font-size:12.5px;line-height:1.6\">General support · Privacy · Security<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Questions, requests and concerns<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">You may contact us if you wish to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Ask questions about this Privacy Notice<\u002Fli>\n            <li>Exercise your data protection rights<\u002Fli>\n            <li>Request access to your personal information<\u002Fli>\n            <li>Request correction or deletion of personal information where applicable<\u002Fli>\n            <li>Raise a privacy concern<\u002Fli>\n            <li>Report a suspected privacy or security issue<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We are committed to handling enquiries professionally, fairly and respectfully.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Closing statement<\u002Fh3>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Thank you for taking the time to read this Privacy Notice. Protecting personal information is an important part of the trust our users place in us.<\u002Fp>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Njinius Ltd is committed to managing personal information responsibly through transparent practices, appropriate security measures and continuous improvement of the Service.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Our aim is to provide a secure, reliable and trustworthy platform that supports professionals in maintaining accurate, well-organised and meaningful Professional Records throughout their careers.<\u002Fp>\n        <\u002Fsection>\n\n        <div data-theme=\"inverse\" style=\"margin:var(--space-9) 0 0;padding:30px 32px;background:linear-gradient(148deg,#22343A 0%,#141F22 60%,#0D1517 100%);border-radius:var(--radius-2xl)\">\n          <p style=\"margin:0 0 10px;font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--coral-300)\">Our privacy commitment<\u002Fp>\n          <p style=\"margin:0 0 12px;color:var(--neutral-200);font-size:var(--text-sm);line-height:1.75\">At Njinius, we believe that privacy is built on more than compliance. It is built on trust, transparency and respect for the professionals who choose to use our Service. We are committed to:<\u002Fp>\n          <ul style=\"margin:0 0 14px;padding-left:20px;color:var(--neutral-200);font-size:var(--text-sm);line-height:1.85\">\n            <li>Being clear about how personal information is used<\u002Fli>\n            <li>Collecting only the information needed to provide and improve the Service<\u002Fli>\n            <li>Protecting Professional Records through appropriate technical and organisational safeguards<\u002Fli>\n            <li>Giving users meaningful control over their information wherever reasonably possible<\u002Fli>\n            <li>Continually reviewing and improving our privacy and security practices as the Service evolves<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--neutral-300);font-size:var(--text-sm);line-height:1.75\">Privacy is not simply a legal obligation. It is a responsibility that supports the confidence our users place in us every day.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:var(--space-7);padding-top:var(--space-6);border-top:1px solid var(--border-subtle)\">\n          <p style=\"margin:0;color:var(--text-mu
