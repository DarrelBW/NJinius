document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ect x=\"4\" y=\"4.5\" width=\"16\" height=\"16\" rx=\"2.4\"><\u002Frect><path d=\"M8 3v3M16 3v3M4.5 9.5h15\"><\u002Fpath><\u002Fsvg>\n          Version 1.0 · Effective July 2026\n        <\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--neutral-300)\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"var(--coral-300)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M12 3l7 3v5.5c0 4.5-3 7.7-7 9.5-4-1.8-7-5-7-9.5V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n          Controller: NJINIUS LTD\n        <\u002Fspan>\n        <a href=\"mailto:privacy@njinius.com\" style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--neutral-200);font-weight:500\" style-hover=\"color:#fff\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"var(--coral-300)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.4\"><\u002Frect><path d=\"m3.6 6.6 8.4 6 8.4-6\"><\u002Fpath><\u002Fsvg>\n          privacy@njinius.com\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-sec=\"\" style=\"background:var(--surface-page);padding:var(--space-10) 40px var(--space-12)\">\n    <div data-legal-grid=\"\" style=\"max-width:var(--container-xl);margin:0 auto;display:grid;grid-template-columns:var(--legal-cols,262px 1fr);gap:var(--space-9);align-items:start\">\n\n      <aside data-toc=\"\" style=\"position:sticky;top:100px;display:block\">\n        <p style=\"font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-muted);margin:0 0 14px\">On this page<\u002Fp>\n        <nav style=\"display:flex;flex-direction:column;gap:1px;border-left:1px solid v  users place in us. We are committed to handling personal information responsibly, transparently and in accordance with applicable data protection legislation, including the UK General Data Protection Regulation (UK GDPR) and the Data Protection Act 2018.<\u002Fp>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This Privacy Notice applies whenever you access or use the Njinius Service, including our mobile applications, website and any associated services.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Please read this Privacy Notice carefully so that you understand how your information is used and the choices available to you.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"s2\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">02<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">About Njinius Ltd<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Njinius Ltd is the controller of the personal information processed through the Njinius Service.<\u002Fp>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We are responsible for determining how and why personal information is processed in connection with the Service and for ensuring that such processing is carried out in accordance with applicable data protection legislation.<\u002Fp>\n          <div style=\"margin:22px 0 16px;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 10px;font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-brand)\">Company information<\u002Fp>\n            <p style=\"margin:0;color:var(--text-strong);font-size:var(--text-base);line-height:1.7;font-weight:500\">Njinius Ltd<br>210 Tonge Moor Road<br>Bolton<br>England<br>BL2 2HN<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">If you have any questions regarding this Privacy Notice or how your personal information is handled, you may contact us using the contact details provided at the end of this document.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"s3\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">03<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Definitions<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 22px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">For the purposes of this Privacy Notice, the following terms have the meanings set out below.<\u002Fp>\n\n          <div style=\"display:grid;gap:0\">\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Account<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">The registered user account used to access the Njinius Service.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Personal Information<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Any information relating to an identified or identifiable individual, as defined under applicable data protection legislation.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Professional Records<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Any information created, uploaded or managed through the Service in support of a user's professional development or competency record. Professional Records may include, but are not limited to:<\u002Fp>\n              <ul style=\"margin:6px 0 0;padding-left:20px;color:var(--text-body);font-size:var(--text-sm);line-height:1.85\">\n                <li>Digital logbooks<\u002Fli>\n                <li>Experience records<\u002Fli>\n                <li>Competency records<\u002Fli>\n                <li>Supporting evidence<\u002Fli>\n                <li>Documents<\u002Fli>\n                <li>Photographs<\u002Fli>\n                <li>Review requests<\u002Fli>\n                <li>Reviewer feedback<\u002Fli>\n                <li>Approval history<\u002Fli>\n                <li>Comments<\u002Fli>\n                <li>Other information submitted through the Service<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Reviewer<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">A person authorised by a user or organisation to review, comment upon or approve Professional Records through the Service.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Service<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">The Njinius platform, including its mobile applications, website and associated services provided by Njinius Ltd.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">User<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Any individual who accesses or uses the Service.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)\">\n              <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:0;color:var(--text-strong)\">Processing<\u002Fh3>\n              <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Any operation performed on Personal Information, including collection, storage, use, disclosure, organisation, retrieval, deletion or destruction.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s4\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">04<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Information we collect<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">To provide the Service, we collect and process different categories of information depending on how you use Njinius.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We only collect information that is reasonably necessary to provide, maintain, improve and protect the Service or to meet our legal obligations. The categories of information we collect are described below.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.1 Account information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">When you create an account, we may collect information such as:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Your name<\u002Fli>\n            <li>Email address<\u002Fli>\n            <li>Account credentials<\u002Fli>\n            <li>Organisation or employer (where applicable)<\u002Fli>\n            <li>Professional role or occupation<\u002Fli>\n            <li>Profile information that you choose to provide<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This information allows us to create and manage your account, authenticate your identity and provide access to the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.2 Professional Records<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">As part of the Service, users may create and manage Professional Records. These may include:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Digital logbooks<\u002Fli>\n            <li>Experience records<\u002Fli>\n            <li>Competency records<\u002Fli>\n            <li>Supporting evidence<\u002Fli>\n            <li>Documents<\u002Fli>\n            <li>Photographs<\u002Fli>\n            <li>Reviewer requests<\u002Fli>\n            <li>Reviewer comments<\u002Fli>\n            <li>Approval history<\u002Fli>\n            <li>Notes and other information submitted by users<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Professional Records are created and managed by users to support their own professional development, competency management and record keeping.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.3 Communications<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">If you contact Njinius, we may collect information relating to those communications, including:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Emails<\u002Fli>\n            <li>Support requests<\u002Fli>\n            <li>Feedback<\u002Fli>\n            <li>Feature suggestions<\u002Fli>\n            <li>Responses to enquiries<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We use this information to respond to requests, improve the Service and provide user support.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.4 Technical information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">When you use the Service, certain technical information may be collected automatically. This may include:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Device type<\u002Fli>\n            <li>Operating system<\u002Fli>\n            <li>Application version<\u002Fli>\n            <li>Browser type (where applicable)<\u002Fli>\n            <li>Internet Protocol (IP) address<\u002Fli>\n            <li>Date and time of access<\u002Fli>\n            <li>Diagnostic information<\u002Fli>\n            <li>Crash reports<\u002Fli>\n            <li>Security-related event information<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This information helps us maintain the security, reliability and performance of the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.5 Usage information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We may collect information about how users interact with the Service. Examples include:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Features used<\u002Fli>\n            <li>Pages or screens accessed<\u002Fli>\n            <li>Actions performed within the Service<\u002Fli>\n            <li>General usage patterns<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This information helps us improve usability, identify issues and continue developing the Service.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where reasonably practicable, we use aggregated or anonymised information when analysing usage trends.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.6 Reviewer information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where Professional Records are shared for review, we may process information relating to reviewers, including:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Reviewer identity<\u002Fli>\n            <li>Review comments<\u002Fli>\n            <li>Approval decisions<\u002Fli>\n            <li>Dates of reviews<\u002Fli>\n            <li>Other information necessary to support the review process<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This information enables the Service to maintain an accurate and transparent record of professional reviews.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">4.7 Information you choose to provide<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Some information is provided entirely at your discretion. For example, you may choose to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Upload additional supporting evidence<\u002Fli>\n            <li>Add photographs<\u002Fli>\n            <li>Include supplementary notes<\u002Fli>\n            <li>Complete optional profile information<\u002Fli>\n            <li>Submit feedback or suggestions<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">You remain responsible for ensuring that any information you provide through the Service may lawfully be shared and does not breach any confidentiality or other legal obligations.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Important note<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">You are not required to provide information that is unnecessary for your use of the Service. However, where certain information is required to create an account, maintain Professional Records or use particular features, the Service may not function correctly without it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s5\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">05<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">How we collect information<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We collect information in several different ways depending on how you interact with the Service.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Understanding how information is collected helps explain why different types of information are processed throughout your use of Njinius.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">5.1 Information you provide directly<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Most of the information processed by the Service is provided directly by you. Examples include when you:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Create an account<\u002Fli>\n            <li>Complete your profile<\u002Fli>\n            <li>Record professional experience<\u002Fli>\n            <li>Upload supporting evidence<\u002Fli>\n            <li>Request reviews<\u002Fli>\n            <li>Submit feedback<\u002Fli>\n            <li>Contact us<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">You control the information you choose to submit, subject to the requirements of the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">5.2 Information generated through use of the Service<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Certain information is generated automatically as part of your normal use of the Service. Examples include:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Login activity<\u002Fli>\n            <li>Account security events<\u002Fli>\n            <li>Application diagnostics<\u002Fli>\n            <li>Device information<\u002Fli>\n            <li>Usage statistics<\u002Fli>\n            <li>Review history<\u002Fli>\n            <li>System-generated timestamps<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This information helps us operate, secure and improve the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">5.3 Information provided by reviewers<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where Professional Records are submitted for review, authorised reviewers may contribute information such as:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Comments<\u002Fli>\n            <li>Recommendations<\u002Fli>\n            <li>Approval decisions<\u002Fli>\n            <li>Feedback<\u002Fli>\n            <li>Review dates<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This information becomes part of the Professional Record and supports the transparency and integrity of the review process.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">5.4 Information collected automatically<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Some technical information is collected automatically when you access the Service. This may include information necessary to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Maintain security<\u002Fli>\n            <li>Detect fraudulent or unauthorised activity<\u002Fli>\n            <li>Diagnose technical issues<\u002Fli>\n            <li>Improve performance<\u002Fli>\n            <li>Ensure reliable operation<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where possible, we minimise the amount of personal information collected and use aggregated or anonymised information where appropriate.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">5.5 Information from organisations<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where your use of the Service is connected to an employer, training provider or other organisation, certain information relating to your account or Professional Records may be made available to Njinius by that organisation, or shared with it, where appropriate and authorised.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Such processing will only take place where there is an appropriate legal basis and is consistent with this Privacy Notice.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"s6\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">06<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">How we use your information<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We use personal information only where it is necessary to operate, maintain, improve and protect the Njinius Service, fulfil our contractual and legal obligations, and support the professional record management services requested by our users.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We do not use personal information for purposes that are incompatible with those described in this Privacy Notice.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.1 To provide the Service<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">The primary purpose of processing personal information is to provide the functionality of the Njinius Service. This includes processing information to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Create and manage user accounts<\u002Fli>\n            <li>Authenticate users<\u002Fli>\n            <li>Maintain Professional Records<\u002Fli>\n            <li>Store supporting evidence<\u002Fli>\n            <li>Facilitate professional reviews<\u002Fli>\n            <li>Record reviewer feedback<\u002Fli>\n            <li>Display Professional Records to authorised users<\u002Fli>\n            <li>Deliver the core functionality of the Service<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Without this processing, the Service would not be able to perform its intended purpose.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.2 To maintain and improve the Service<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We continually review and improve the Service to ensure it remains secure, reliable and useful to our users. Information may be processed to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Improve usability<\u002Fli>\n            <li>Develop new functionality<\u002Fli>\n            <li>Identify technical issues<\u002Fli>\n            <li>Diagnose software faults<\u002Fli>\n            <li>Improve application performance<\u002Fli>\n            <li>Monitor service reliability<\u002Fli>\n            <li>Improve accessibility<\u002Fli>\n            <li>Enhance user experience<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where reasonably practicable, we use aggregated or anonymised information when analysing trends and improving the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.3 To protect the security of the Service<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Protecting the integrity of the Service is an important part of our responsibility to users. We may process information to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Detect suspicious activity<\u002Fli>\n            <li>Prevent unauthorised access<\u002Fli>\n            <li>Protect user accounts<\u002Fli>\n            <li>Monitor security events<\u002Fli>\n            <li>Investigate suspected misuse<\u002Fli>\n            <li>Respond to security incidents<\u002Fli>\n            <li>Protect the confidentiality, integrity and availability of the Service<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">These activities help safeguard both the Service and the Professional Records entrusted to it.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.4 To support professional reviews<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where users request reviews of their Professional Records, we process relevant information to facilitate that process. This includes enabling reviewers to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Access Professional Records that have been shared with them<\u002Fli>\n            <li>Provide comments and feedback<\u002Fli>\n            <li>Record approval decisions<\u002Fli>\n            <li>Maintain an auditable review history<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">The Service supports the review process but does not replace the professional judgement of reviewers.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.5 To communicate with you<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We may use your information to communicate with you regarding:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Your account<\u002Fli>\n            <li>Security notifications<\u002Fli>\n            <li>Service updates<\u002Fli>\n            <li>Support requests<\u002Fli>\n            <li>Changes to the Service<\u002Fli>\n            <li>Changes to this Privacy Notice or other legal documents<\u002Fli>\n            <li>Other important administrative communications<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We do not send marketing communications unless you have chosen to receive them or another lawful basis applies.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.6 To comply with legal obligations<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">In certain circumstances, we may process personal information where necessary to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Comply with legal obligations<\u002Fli>\n            <li>Respond to lawful requests from public authorities<\u002Fli>\n            <li>Prevent fraud or unlawful activity<\u002Fli>\n            <li>Establish, exercise or defend legal claims<\u002Fli>\n            <li>Meet regulatory requirements<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Such processing will only take place where permitted or required by applicable law.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">6.7 To improve user support<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Information relating to support requests, technical issues and user feedback may be processed to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Respond to enquiries<\u002Fli>\n            <li>Investigate reported issues<\u002Fli>\n            <li>Improve support services<\u002Fli>\n            <li>Resolve technical problems<\u002Fli>\n            <li>Identify recurring issues<\u002Fli>\n            <li>Improve future releases of the Service<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">This helps us continually improve both the quality of the Service and the support we provide.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:22px 24px;background:var(--neutral-50);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 10px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">What we do not do<\u002Fp>\n            <p style=\"margin:0 0 9px;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Transparency also means explaining what we do not do. Njinius Ltd does not sell users' personal information, and we do not use Professional Records for advertising purposes.<\u002Fp>\n            <p style=\"margin:0 0 9px;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">We do not access, review or use Professional Records except where this is necessary to operate the Service, provide requested functionality, comply with legal obligations or protect the security and integrity of the Service.<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Where access to Professional Records is necessary for support or maintenance purposes, it will be limited to what is reasonably required for that purpose and carried out in accordance with appropriate security and confidentiality measures.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s7\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">07<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Our lawful bases for processing<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Under applicable data protection legislation, every use of personal information must have a lawful basis.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">The lawful basis we rely upon depends on the purpose for which personal information is processed.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">7.1 Performance of a contract<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Most processing carried out by Njinius is necessary to provide the Service requested by users. This includes activities such as:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Creating user accounts<\u002Fli>\n            <li>Maintaining Professional Records<\u002Fli>\n            <li>Facilitating professional reviews<\u002Fli>\n            <li>Providing requested functionality<\u002Fli>\n            <li>Delivering user support directly related to the Service<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Without this processing, we would be unable to provide the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">7.2 Legitimate interests<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We may process personal information where it is necessary for our legitimate interests, provided those interests are not overridden by your rights and freedoms. Examples include:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Improving the Service<\u002Fli>\n            <li>Maintaining platform security<\u002Fli>\n            <li>Preventing misuse<\u002Fli>\n            <li>Investigating technical issues<\u002Fli>\n            <li>Enhancing reliability and performance<\u002Fli>\n            <li>Responding to user feedback<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Whenever we rely on legitimate interests, we consider the impact on users and seek to ensure that processing remains fair, proportionate and transparent.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">7.3 Legal obligations<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We may process personal information where necessary to comply with legal obligations.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Examples include responding to lawful requests, meeting statutory requirements and fulfilling obligations imposed by applicable legislation or regulatory authorities.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">7.4 Consent<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">In some circumstances, we rely upon your consent to process personal information. Where consent is used:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>It will be requested clearly<\u002Fli>\n            <li>It may be withdrawn at any time<\u002Fli>\n            <li>Withdrawal of consent will not affect processing that took place before consent was withdrawn<\u002Fli>\n          <\u002Ful>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Choosing the appropriate lawful basis<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Different activities carried out by the Service may rely on different lawful bases. Where this occurs, we apply the lawful basis that is most appropriate for the particular processing activity rather than relying on a single basis for all processing.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s8\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">08<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Sharing your information<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We treat the information entrusted to us with care. We do not share personal information except where it is necessary to operate the Service, fulfil legal obligations or where you have authorised us to do so.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where personal information is shared, we take reasonable steps to ensure that it is handled securely and only for legitimate purposes.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">8.1 Service providers<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Like most modern online services, Njinius works with carefully selected service providers who help us deliver, maintain and improve the Service. These providers may assist with activities such as:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Secure cloud infrastructure<\u002Fli>\n            <li>Data storage<\u002Fli>\n            <li>User authentication<\u002Fli>\n            <li>Email communications<\u002Fli>\n            <li>Application monitoring<\u002Fli>\n            <li>Technical diagnostics<\u002Fli>\n            <li>Security services<\u002Fli>\n            <li>Software development and operational support<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">These organisations process personal information only on our behalf, under appropriate contractual arrangements and only to the extent necessary to provide their services.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We do not permit our service providers to use personal information for their own independent purposes.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">8.2 Professional reviews<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where users choose to share Professional Records for review, the information selected by the user will be made available to the reviewers they have authorised.<\u002Fp>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Reviewers will only be able to access Professional Records that have been intentionally shared with them through the Service.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Users remain responsible for deciding which Professional Records they choose to submit for review.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">8.3 Organisations<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where the Service is used as part of an employer, training provider or other authorised organisation, certain Professional Records or account information may be shared with that organisation where:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>the user has authorised the sharing;<\u002Fli>\n            <li>it is necessary to provide the Service; or<\u002Fli>\n            <li>another lawful basis applies.<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Any such sharing will be carried out in accordance with applicable data protection legislation.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">8.4 Legal and regulatory requirements<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We may disclose personal information where required or permitted by law. Examples include where disclosure is necessary to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Comply with legal obligations<\u002Fli>\n            <li>Respond to lawful requests from public authorities<\u002Fli>\n            <li>Protect the rights, property or safety of Njinius Ltd, our users or others<\u002Fli>\n            <li>Prevent fraud or unlawful activity<\u002Fli>\n            <li>Establish, exercise or defend legal claims<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Any disclosure will be limited to what is reasonably necessary for the relevant purpose.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">8.5 Business changes<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">If Njinius Ltd undergoes a business reorganisation, merger, acquisition or sale of assets, personal information may be transferred as part of that transaction.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where appropriate, we will take reasonable steps to ensure that any successor organisation continues to protect personal information in a manner consistent with this Privacy Notice.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:22px 24px;background:var(--neutral-50);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 10px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">What we do not do<\u002Fp>\n            <ul style=\"margin:0;padding-left:20px;color:var(--text-body);font-size:var(--text-sm);line-height:1.8\">\n              <li>We do not sell personal information.<\u002Fli>\n              <li>We do not make Professional Records publicly available without your knowledge or authorisation.<\u002Fli>\n              <li>We do not disclose personal information to third parties for their own marketing purposes.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s9\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">09<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">International transfers<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Njinius primarily seeks to process and store personal information using services that provide appropriate safeguards for international data transfers.<\u002Fp>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where personal information is transferred outside the United Kingdom, we will ensure that appropriate legal safeguards are in place, such as:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>An adequacy decision recognised under applicable data protection legislation<\u002Fli>\n            <li>Standard contractual clauses or other approved transfer mechanisms<\u002Fli>\n            <li>Any other safeguard recognised by applicable law<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">These measures are intended to ensure that personal information continues to receive an appropriate level of protection regardless of where it is processed.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Our approach<\u002Fp>\n            <p style=\"margin:0;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">Where reasonably practicable, we seek to minimise international transfers of personal information. When international transfers are necessary, we select service providers that demonstrate appropriate standards of security, privacy and regulatory compliance.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s10\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">10<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Data security<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Protecting Professional Records and personal information is one of our highest priorities.<\u002Fp>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Njinius Ltd uses appropriate technical and organisational measures designed to protect personal information against accidental or unlawful destruction, loss, alteration, unauthorised disclosure or unauthorised access.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">These measures are regularly reviewed and updated to reflect changes in technology, security risks and the development of the Service.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Security measures<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Depending on the nature of the processing, security measures may include:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Encryption of data during transmission<\u002Fli>\n            <li>Encryption of stored information where appropriate<\u002Fli>\n            <li>Secure user authentication<\u002Fli>\n            <li>Access controls based on the principle of least privilege<\u002Fli>\n            <li>Role-based access controls<\u002Fli>\n            <li>Security monitoring<\u002Fli>\n            <li>System logging and auditing<\u002Fli>\n            <li>Regular software updates<\u002Fli>\n            <li>Vulnerability management<\u002Fli>\n            <li>Secure development practices<\u002Fli>\n          <\u002Ful>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Access to personal information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Access to personal information is restricted to authorised persons who require it to perform their responsibilities.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Access is granted only where necessary and is subject to appropriate security controls.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">Responding to security incidents<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Despite appropriate safeguards, no online service can guarantee absolute security.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">If we become aware of a security incident affecting personal information, we will respond appropriately and, where required by law, notify affected individuals and relevant regulatory authorities.<\u002Fp>\n\n          <div style=\"margin:26px 0 0;padding:20px 22px;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--radius-lg)\">\n            <p style=\"margin:0 0 8px;font-family:var(--font-display);font-size:var(--text-base);font-weight:600;color:var(--text-strong)\">Security is a shared responsibility<\u002Fp>\n            <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-sm);line-height:1.7\">While we work hard to protect the Service, users also play an important role. We encourage users to:<\u002Fp>\n            <ul style=\"margin:0;padding-left:20px;color:var(--text-body);font-size:var(--text-sm);line-height:1.8\">\n              <li>Keep account credentials secure<\u002Fli>\n              <li>Choose strong passwords<\u002Fli>\n              <li>Protect devices used to access the Service<\u002Fli>\n              <li>Notify us promptly if they believe their account has been compromised<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s11\" style=\"scroll-margin-top:100px;padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-brand)\">11<\u002Fspan>\n            <h2 style=\"font-family:var(--font-display);font-size:clamp(22px,2.3vw,28px);line-height:1.16;letter-spacing:-0.025em;margin:0;color:var(--text-strong)\">Data retention<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 13px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We retain personal information only for as long as it is reasonably necessary to fulfil the purposes described in this Privacy Notice, comply with legal obligations, resolve disputes and support the legitimate operation of the Service.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Retention periods vary depending on the type of information involved and the purpose for which it is processed.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">11.1 Account information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">We retain account information for as long as your account remains active. If your account is closed, certain information may be retained for an appropriate period where necessary to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Comply with legal obligations<\u002Fli>\n            <li>Resolve disputes<\u002Fli>\n            <li>Prevent fraud or misuse<\u002Fli>\n            <li>Maintain the security and integrity of the Service<\u002Fli>\n            <li>Enforce our Terms of Use<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Once retention is no longer necessary, personal information will be securely deleted or anonymised where appropriate.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">11.2 Professional Records<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Professional Records are retained to enable users to access and manage their professional history throughout their use of the Service.<\u002Fp>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Where a user requests account deletion, Professional Records will ordinarily be deleted together with the account, unless retention is required or permitted by law.<\u002Fp>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Before requesting account deletion, users are encouraged to export or otherwise retain any Professional Records they wish to keep, as deleted information may not be recoverable.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">11.3 Support and communication records<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Support requests, correspondence and related communications may be retained for a reasonable period to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Respond to ongoing enquiries<\u002Fli>\n            <li>Improve customer support<\u002Fli>\n            <li>Investigate reported issues<\u002Fli>\n            <li>Maintain appropriate business records<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">These records are retained only for as long as reasonably necessary.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">11.4 Technical and security information<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Technical logs, diagnostic information and security-related records may be retained for limited periods to:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>Maintain system security<\u002Fli>\n            <li>Investigate incidents<\u002Fli>\n            <li>Monitor service reliability<\u002Fli>\n            <li>Prevent misuse<\u002Fli>\n            <li>Meet legal or regulatory obligations<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">Retention periods for these records are determined according to their operational purpose and applicable legal requirements.<\u002Fp>\n\n          <h3 style=\"font-family:var(--font-display);font-size:var(--text-lg);margin:30px 0 10px;color:var(--text-strong)\">11.5 How we decide retention periods<\u002Fh3>\n          <p style=\"margin:0 0 10px;color:var(--text-body);font-size:var(--text-base);line-height:1.75\">When determining how long information should be retained, we consider factors such as:<\u002Fp>\n          <ul style=\"margin:0 0 12px;padding-left:20px;color:var(--text-body);font-size:var(--text-base);line-height:1.85\">\n            <li>The purpose for which the information was collected<\u002Fli>\n            <li>The nature and sensitivity of the information<\u002Fli>\n            <li>Legal and regulatory requirements<\u002Fli>\n            <li>Security considerations<\u002Fli>\n
